name: research-scout

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: research_scout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 健康检查：数据库真正能通过网络接受连接，才算"健康"
    # 用 -h 127.0.0.1 走 TCP：首次初始化时的临时服务只开放本地套接字，这样不会被误判为已就绪
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U scout -d research_scout"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD}@db:5432/research_scout
    # 启动时先执行数据库迁移，成功后再启动网页服务（参照 Onyx 的 api_server）
    # exec：让 fastapi 替换掉 sh，成为容器里的 1 号进程，docker stop 发出的停止信号能直接送到它
    command: ["sh", "-c", "alembic upgrade head && exec fastapi run main.py --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      # 下载的 PDF 和 HTML 缓存，重建容器后仍然保留
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
